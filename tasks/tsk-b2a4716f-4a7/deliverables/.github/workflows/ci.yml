# ============================================================
# 界外 EdgeReader — CI 流水线 (PR 检查)
# 触发条件: PR 到 main/develop 分支
# 包含: 代码检查、自动化测试、Docker 镜像构建、安全扫描
# ============================================================
name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# 取消同一 PR 的旧运行
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

permissions:
  contents: read
  pull-requests: write
  packages: read
  security-events: write

jobs:
  # ============================================================
  # Job 1: 后端代码检查 (golangci-lint)
  # ============================================================
  lint-backend:
    name: "Backend Lint (golangci-lint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./server
          args: --timeout=5m --config=../.golangci.yml
        continue-on-error: false

  # ============================================================
  # Job 2: 前端代码检查 (eslint + type-check)
  # ============================================================
  lint-frontend:
    name: "Frontend Lint (ESLint + TypeCheck)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint || echo "::warning::ESLint check completed with warnings"

      - name: Run TypeScript type check
        run: pnpm vue-tsc --noEmit || echo "::warning::TypeScript check completed with warnings"

  # ============================================================
  # Job 3: 后端自动化测试 (go test + 覆盖率)
  # ============================================================
  test-backend:
    name: "Backend Tests (go test)"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: edgereader_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: ./server
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: edgereader_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      GIN_MODE: test
      JWT_SECRET: test-jwt-secret-for-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.txt
          TOTAL=$(grep "total:" coverage-summary.txt | awk '{print $NF}')
          echo "### Backend Coverage: ${TOTAL}" >> $GITHUB_STEP_SUMMARY
          echo "COVERAGE=${TOTAL}" >> $GITHUB_ENV

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.out
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = process.env.COVERAGE || 'N/A';
            const body = `## 🧪 Backend Test Coverage\n\n**Total Coverage: ${coverage}**\n\n_Generated by CI Pipeline_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Backend Test Coverage'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============================================================
  # Job 4: 前端自动化测试 (vitest)
  # ============================================================
  test-frontend:
    name: "Frontend Tests (Vitest)"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: |
          pnpm vitest run --coverage --reporter=verbose 2>&1 | tee test-output.txt || true
          echo "### Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  # ============================================================
  # Job 5: Docker 镜像构建 + Trivy 安全扫描
  # ============================================================
  docker-build-scan:
    name: "Docker Build & Security Scan"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    strategy:
      matrix:
        include:
          - context: ./server
            image-name: server
            dockerfile: ./server/Dockerfile
          - context: ./web
            image-name: web
            dockerfile: ./web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: edgereader/${{ matrix.image-name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: edgereader/${{ matrix.image-name }}:pr-${{ github.event.pull_request.number }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: trivy-${{ matrix.image-name }}.txt

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image-name }}
          path: trivy-${{ matrix.image-name }}.txt
          retention-days: 7

      - name: Post Trivy results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const imageName = '${{ matrix.image-name }}';
            let report = 'No vulnerabilities found ✅';
            try {
              report = fs.readFileSync(`trivy-${imageName}.txt`, 'utf8');
              if (report.length > 3000) {
                report = report.substring(0, 3000) + '\n... (truncated)';
              }
            } catch (e) {}
            const body = `## 🔒 Trivy Security Scan: ${imageName}\n\n\`\`\`\n${report}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ============================================================
  # Job 6: CI 状态汇总
  # ============================================================
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, docker-build-scan]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint | ${{ needs.lint-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Scan | ${{ needs.docker-build-scan.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.lint-backend.result == 'failure' ||
          needs.test-backend.result == 'failure' ||
          needs.docker-build-scan.result == 'failure'
        run: exit 1
