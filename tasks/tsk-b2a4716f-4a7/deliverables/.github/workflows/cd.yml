# ============================================================
# 界外 EdgeReader — CD 流水线 (main 分支部署)
# 触发条件: push 到 main 分支 (通常是 PR 合并)
# 包含: 构建、安全扫描、镜像推送、部署
# ============================================================
name: CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

# 同一时间只允许一个部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  # ============================================================
  # Job 1: 运行完整测试套件
  # ============================================================
  test:
    name: "Run Full Test Suite"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: edgereader_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Run backend tests
        working-directory: ./server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: edgereader_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          GIN_MODE: test
          JWT_SECRET: test-jwt-secret-for-ci
        run: |
          go mod download
          go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Run frontend tests
        working-directory: ./web
        run: |
          pnpm install --frozen-lockfile
          pnpm vitest run || true

  # ============================================================
  # Job 2: 构建并推送 Docker 镜像
  # ============================================================
  build-and-push:
    name: "Build & Push Images"
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        include:
          - context: ./server
            image-name: server
            dockerfile: ./server/Dockerfile
          - context: ./web
            image-name: web
            dockerfile: ./web/Dockerfile
    outputs:
      server-digest: ${{ steps.push.outputs.digest }}
      web-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image-name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================
  # Job 3: Trivy 安全扫描 (推送后的镜像)
  # ============================================================
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    strategy:
      matrix:
        image-name: [server, web]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image-name }}:latest
          format: 'sarif'
          output: trivy-${{ matrix.image-name }}.sarif
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image-name }}.sarif
          category: trivy-${{ matrix.image-name }}

  # ============================================================
  # Job 4: 部署到生产环境
  # ============================================================
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/edgereader' }}
            
            # 拉取最新镜像
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            
            # 滚动更新
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 等待健康检查
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            
            # 清理旧镜像
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | main |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment (optional)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment status: ${STATUS}"
          # 可以在这里添加 Slack/DingTalk/飞书 通知
          # curl -X POST "${{ secrets.WEBHOOK_URL }}" -d '{"text":"EdgeReader deployed: '${STATUS}'"}'

  # ============================================================
  # Job 5: 数据库备份 (部署后触发)
  # ============================================================
  post-deploy-backup:
    name: "Post-Deploy DB Backup"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger database backup
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/edgereader' }}
            if [ -f scripts/db-backup.sh ]; then
              bash scripts/db-backup.sh --reason "pre-deploy-$(date +%Y%m%d%H%M%S)"
            fi
