# ============================================================
# 界外 EdgeReader — 数据库定时备份工作流
# 触发条件: 每日 UTC 02:00 (北京时间 10:00)
# 包含: mysqldump + AES-256-GCM 加密 + S3 上传 + 轮转清理
# ============================================================
name: Database Backup

on:
  schedule:
    # 每日 UTC 02:00 执行 (北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Backup reason (e.g., pre-migration, manual)'
        required: false
        default: 'manual'

env:
  BACKUP_RETENTION_DAILY: 7      # 每日备份保留天数
  BACKUP_RETENTION_WEEKLY: 30    # 每周备份保留天数

permissions:
  contents: read

jobs:
  backup:
    name: "Database Backup & Upload"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run database backup
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/edgereader' }}
            
            REASON="${{ github.event.inputs.reason || 'scheduled' }}"
            
            # 执行备份脚本
            bash scripts/db-backup.sh --reason "${REASON}"
            
            # 执行轮转清理
            bash scripts/db-backup.sh --rotate

      - name: Verify backup
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/edgereader' }}
            bash scripts/db-backup.sh --verify-latest

      - name: Backup summary
        if: always()
        run: |
          echo "## 💾 Database Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reason | ${{ github.event.inputs.reason || 'scheduled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
